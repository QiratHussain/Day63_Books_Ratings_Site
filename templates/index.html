<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Library</title>
  </head>
  <body>
    <h1>My Library</h1>
    {% if not books_list: %}
    <p>Library is empty</p>
    {% else: %}
    {% for book in books_list: %}
    <ul>
      <li>{{book['title']}}:{{book['author']}}:{{book['rating']}} -<a>Edit Rating</a>-<a>Delete</a></li>
    </ul>
    {% endfor %}
    {% endif %}

    <a href="{{url_for('add')}}">Add New Book</a>
  </body>
</html>
